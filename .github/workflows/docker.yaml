on:
  push:
    branches:
      - "main"

  workflow_dispatch:

jobs:
  upload-image:
    runs-on: ubuntu-latest
    steps:
      - name: "checkout repo"
        uses: actions/checkout@v3

      - name: "build the image"
        run: |
          docker build -t api-nightfall-is-a-dev:latest .

      - name: "tag the image"
        run: |
          docker tag api-nightfall-is-a-dev:latest \
          nightfall3594/api-nightfall-is-a-dev:${{ github.sha }}

      - name: "login to docker"
        run: |
          echo "${{ secrets.DOCKER_TOKEN }}" | docker login \
          -u "${{ secrets.DOCKER_USERNAME }}" \
          --password-stdin

      - name: "push the image"
        run: |
          docker push nightfall3594/api-nightfall-is-a-dev:${{ github.sha }}
